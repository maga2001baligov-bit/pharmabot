<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Фармаколог — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <header class="masthead">
      <div class="masthead-mark">℞</div>
      <h1>Фармаколог</h1>
      <p class="masthead-sub">Экзаменационный тренажёр · 1&nbsp;этап</p>
    </header>

    <nav class="deck">
      <button class="ticket" data-mode="train_test">
        <span class="ticket-no">№01</span>
        <span class="ticket-title">Тесты</span>
        <span class="ticket-desc">Тренировка · 159 заданий вразброс</span>
        <span class="ticket-perf" aria-hidden="true"></span>
      </button>

      <button class="ticket" data-mode="exam_test">
        <span class="ticket-no">№02</span>
        <span class="ticket-title">Тесты</span>
        <span class="ticket-desc">Билет · 40 случайных заданий</span>
        <span class="ticket-perf" aria-hidden="true"></span>
      </button>

      <button class="ticket" data-mode="train_recipe">
        <span class="ticket-no">№03</span>
        <span class="ticket-title">Рецепты</span>
        <span class="ticket-desc">Тренировка · 143 препарата</span>
        <span class="ticket-perf" aria-hidden="true"></span>
      </button>

      <button class="ticket" data-mode="exam_recipe">
        <span class="ticket-no">№04</span>
        <span class="ticket-title">Рецепты</span>
        <span class="ticket-desc">Билет · 20 случайных препаратов</span>
        <span class="ticket-perf" aria-hidden="true"></span>
      </button>
    </nav>
  </section>

  <!-- SESSION SCREEN -->
  <section id="screen-session" class="screen hidden">
    <header class="session-bar">
      <button id="btn-back" class="icon-btn" aria-label="Назад">←</button>
      <span id="session-counter" class="session-counter">1 / 40</span>
      <span id="session-label" class="session-label">тесты</span>
    </header>

    <div id="card-area" class="card-area"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="screen-result" class="screen hidden">
    <div class="result-card">
      <div class="result-mark">✓</div>
      <h2>Готово</h2>
      <p id="result-text" class="result-text"></p>
      <button id="btn-again" class="btn-primary">В начало</button>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
