<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Фармаколог — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <h1>Фармаколог</h1>
      <p class="topbar-sub">Подготовка к экзамену · 1 этап</p>
    </header>

    <div class="today-strip" id="today-strip"></div>

    <div class="progress-strip" id="progress-strip"></div>

    <nav class="deck" id="home-deck">
      <button class="card" data-nav="tests">
        <span class="card-icon">📝</span>
        <span class="card-title">Тесты</span>
        <span class="card-sub" id="card-tests-sub"></span>
      </button>
      <button class="card" data-nav="recipes">
        <span class="card-icon">💊</span>
        <span class="card-title">Рецепты</span>
        <span class="card-sub" id="card-recipes-sub"></span>
      </button>
      <button class="card" data-nav="stats">
        <span class="card-icon">📊</span>
        <span class="card-title">Статистика</span>
        <span class="card-sub">Прогресс и история</span>
      </button>
      <button class="card" data-nav="errors">
        <span class="card-icon">❌</span>
        <span class="card-title">Ошибки</span>
        <span class="card-sub" id="card-errors-sub"></span>
      </button>
      <button class="card" data-nav="settings">
        <span class="card-icon">⚙️</span>
        <span class="card-title">Настройки</span>
        <span class="card-sub">Сброс прогресса</span>
      </button>
    </nav>
  </section>

  <!-- MODE SELECT (Тесты / Рецепты) -->
  <section id="screen-modes" class="screen hidden">
    <header class="subbar">
      <button class="icon-btn" data-back="home">←</button>
      <span id="modes-title" class="subbar-title"></span>
    </header>
    <div class="mode-list" id="mode-list"></div>
  </section>

  <!-- ERRORS HUB -->
  <section id="screen-errors" class="screen hidden">
    <header class="subbar">
      <button class="icon-btn" data-back="home">←</button>
      <span class="subbar-title">Ошибки</span>
    </header>
    <div class="mode-list" id="errors-list"></div>
  </section>

  <!-- SESSION -->
  <section id="screen-session" class="screen hidden">
    <header class="session-bar">
      <button class="icon-btn" data-back="modes">←</button>
      <span id="session-counter" class="session-counter">1 / 40</span>
      <span id="session-label" class="session-label">тесты</span>
    </header>
    <div id="card-area" class="card-area"></div>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen hidden">
    <div class="result-card">
      <div class="result-mark" id="result-mark">✓</div>
      <h2>Готово</h2>
      <p id="result-text" class="result-text"></p>
      <div class="result-actions">
        <button id="btn-review-errors" class="btn-secondary hidden">Разобрать ошибки</button>
        <button id="btn-again" class="btn-primary">На главную</button>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="screen-stats" class="screen hidden">
    <header class="subbar">
      <button class="icon-btn" data-back="home">←</button>
      <span class="subbar-title">Статистика</span>
    </header>
    <div id="stats-body" class="stats-body"></div>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen hidden">
    <header class="subbar">
      <button class="icon-btn" data-back="home">←</button>
      <span class="subbar-title">Настройки</span>
    </header>
    <div class="settings-body">
      <p class="settings-note">Прогресс, избранное и статистика хранятся локально в этом браузере/приложении Telegram.</p>
      <button id="btn-reset" class="btn-danger">Сбросить весь прогресс</button>
    </div>
  </section>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
